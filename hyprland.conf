# This file is not a full hyprland configuration.
# It is intended to be included in your main hyprland.conf.

# Active = the theme's own cream -> bg fade (palette white #fbf1c7 -> background); inactive = quiet warm-grey
$activeBorderColor   =  rgba(FFFFFF26)
$inactiveBorderColor =  rgba(FFFFFF03)

general {
    col.active_border = $activeBorderColor
    col.inactive_border = $inactiveBorderColor
    gaps_in = 2
    gaps_out = 3
    border_size = 2
}

group {
    col.border_active = $activeBorderColor
    col.border_inactive = $inactiveBorderColor
}

# --- Glass / consistency ---------------------------------------------------
# All standard windows glassy + blurred (overrides Omarchy's subtle 0.97/0.9).
# Media/Steam/browsers keep their Omarchy opt-out (opacity 1) so photos, video
# and web pages stay solid; this only hits windows still tagged default-opacity.
windowrule = opacity 1 0.84, match:tag default-opacity

# Blur layer-shell surfaces (OSD + notifications) to match the window glass.
layerrule = blur on, ignore_alpha 0.3, match:namespace swayosd
layerrule = blur on, ignore_alpha 0.3, match:namespace notifications
layerrule = blur on, ignore_alpha 0.3, match:namespace walker
# Bars: inert unless the bar's own background is semi-transparent —
# pre-wired so anyone styling waybar/quickshell with alpha gets blur for free.
layerrule = blur on, ignore_alpha 0.3, match:namespace waybar
layerrule = blur on, ignore_alpha 0.3, match:namespace quickshell

layerrule = no_anim off, match:namespace walker
layerrule = animation slide bottom, match:namespace walker # Slide animation for walker
# layerrule = animation popin, match:namespace walker # Popin animation for walker
# layerrule = animation fade, match:namespace walker # Fade animation for walker

decoration {
    rounding = 23

      shadow {
      enabled = yes
      render_power = 3
      range = 18
      color = rgba(120e0a99)
    }

    # "Clear/Minimal": lighter blur so the illustrated wallpaper stays legible behind windows.
    blur {
        enabled = true
        size = 10
        passes = 4
        new_optimizations = true
        ignore_opacity = true
        xray = false
        noise = 0.0
        contrast = 1.05
        brightness = 0.85
        vibrancy = 0.20
        vibrancy_darkness = 0.0
    }

}

# Quick animation windows
# Credit: END4 (https://github.com/end-4)
animations {
    enabled = true
    # Curves
    bezier = emphasizedDecel, 0.05, 0.7, 0.1, 1
    bezier = emphasizedAccel, 0.3, 0, 0.8, 0.15
    bezier = menu_decel, 0.05, 1, 0, 1
    bezier = menu_accel, 0.52, 0.03, 0.72, 0.08
    # workspaces
    animation = workspaces, 1, 7, menu_decel, slide
    ## specialWorkspace
    animation = specialWorkspaceIn, 1, 2.8, emphasizedDecel, slidevert
    animation = specialWorkspaceOut, 1, 1.2, emphasizedAccel, slidevert
}
